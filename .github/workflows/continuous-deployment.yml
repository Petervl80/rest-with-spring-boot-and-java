name: Continuous Integration and Delivery

on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Login to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/${{ secrets.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: '${{ secrets.IAM_USER }}@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Authentication for Google Cloud Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Application .jar
      working-directory: ./rest-with-spring-boot-and-java
      run: mvn clean package

    - name: Docker Compose Build
      working-directory: .
      run: docker compose build

    - name: Push to Google Cloud Artifact Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-and-java:latest ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot-and-java:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-and-java:latest ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot-and-java:${{ github.run_id }}
        
        docker push ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot-and-java:latest
        docker push ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot-and-java:${{ github.run_id }}

    - name: Push to Docker Hub
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-and-java:latest petervl80/rest-with-spring-boot-and-java:${{ github.run_id }}
        
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-and-java:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-and-java:${{ github.run_id }}